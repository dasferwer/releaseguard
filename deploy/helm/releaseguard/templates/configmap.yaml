apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "releaseguard.fullname" . }}
  labels:
    {{- include "releaseguard.labels" . | nindent 4 }}
data:
  LOG_LEVEL: {{ .Values.config.logLevel | quote }}
  CANARY_TIMEOUT_SECONDS: {{ .Values.config.canaryTimeoutSeconds | quote }}
  RECONCILE_INTERVAL_SECONDS: {{ .Values.config.reconcileIntervalSeconds | quote }}

